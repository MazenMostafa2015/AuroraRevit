name: Build Revit Add-in Installer

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Create a GitHub Release for this run'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release
  RELEASE_VERSION: 1.9.0
  RELEASE_TITLE: AuroraRevit v1.9.0 - Command Tools Edition

jobs:
  build:
    name: Build Revit ${{ matrix.revit-version }} payload
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        revit-version: ['2023', '2024', '2025']

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore solution
        shell: pwsh
        run: >-
          dotnet restore AuroraRevit.sln
          -p:RevitVersion=${{ matrix.revit-version }}
          -r win-x64

      - name: Build Revit add-in
        shell: pwsh
        run: >-
          dotnet build RevitAddin/RevitAddin.csproj
          --configuration $env:CONFIGURATION
          --no-restore
          -p:RevitVersion=${{ matrix.revit-version }}

      - name: Publish self-contained AiProxy
        shell: pwsh
        run: >-
          dotnet publish AiProxy/AiProxy.csproj
          --configuration $env:CONFIGURATION
          --runtime win-x64
          --self-contained true
          --no-restore
          --output publish/AiProxy
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false

      - name: Publish self-contained proxy desktop host
        shell: pwsh
        run: >-
          dotnet publish AiProxy.Desktop/AiProxy.Desktop.csproj
          --configuration $env:CONFIGURATION
          --runtime win-x64
          --self-contained true
          --no-restore
          --output publish/AiProxyGui
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false

      - name: Generate matching Revit manifest
        shell: pwsh
        env:
          REVT_VERSION: ${{ matrix.revit-version }}
        run: >-
          ./RevitAddin/Generate-RevitManifests.ps1
          -AssemblyPath "$env:GITHUB_WORKSPACE/Release/RevitAddin/AuroraRevit.RevitAddin.dll"
          -OutputRoot "$env:GITHUB_WORKSPACE/publish/Manifests"
          -Versions $env:REVT_VERSION

      - name: Stage compiled payload
        shell: pwsh
        env:
          REVT_VERSION: ${{ matrix.revit-version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:GITHUB_WORKSPACE "payload-stage\Revit$env:REVT_VERSION"
          $revitRoot = Join-Path $stage ('Revit' + $env:REVT_VERSION)
          New-Item -ItemType Directory -Path (Join-Path $revitRoot 'Release\RevitAddin') -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $revitRoot ('publish\Manifests\Revit' + $env:REVT_VERSION)) -Force | Out-Null
          Copy-Item 'Release\RevitAddin\*' (Join-Path $revitRoot 'Release\RevitAddin') -Recurse -Force
          Copy-Item (Join-Path (Join-Path 'publish\Manifests' ('Revit' + $env:REVT_VERSION)) 'AuroraRevit.addin') (Join-Path $revitRoot ('publish\Manifests\Revit' + $env:REVT_VERSION)) -Force
          if ($env:REVT_VERSION -eq '2025') {
            Copy-Item 'publish\AiProxy' (Join-Path $stage 'common\AiProxy') -Recurse -Force
            Copy-Item 'publish\AiProxyGui' (Join-Path $stage 'common\AiProxyGui') -Recurse -Force
          }

      - name: Upload compiled payload
        uses: actions/upload-artifact@v4
        with:
          name: AuroraRevit-Payload-Revit${{ matrix.revit-version }}
          if-no-files-found: error
          retention-days: 30
          path: payload-stage/Revit${{ matrix.revit-version }}

  installer:
    name: Compile AuroraRevit-Setup.exe
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download Revit payloads
        uses: actions/download-artifact@v4
        with:
          pattern: AuroraRevit-Payload-Revit*
          path: payload-download
          merge-multiple: false

      - name: Stage pyRevit_Extensions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'AuroraRevit.extension'
          $staged = Join-Path $env:GITHUB_WORKSPACE 'pyRevit_Extensions\AuroraRevit.extension'
          if (-not (Test-Path $source)) { throw "Missing pyRevit extension source: $source" }
          New-Item -ItemType Directory -Path $staged -Force | Out-Null
          Copy-Item (Join-Path $source '*') $staged -Recurse -Force
          $required = @(
            'RevitTools.tab\AIAssistant.panel\CommandLogger.pushbutton\script.py',
            'RevitTools.tab\AIAssistant.panel\CommandLine.pushbutton\script.py',
            'RevitTools.tab\AIAssistant.panel\CommandLogViewer.pushbutton\script.py',
            'RevitTools.tab\AIAssistant.panel\CommandToolsStatus.pushbutton\script.py',
            'RevitTools.tab\AIAssistant.panel\ElementInspector.pushbutton\script.py',
            'RevitTools.tab\AIAssistant.panel\QuickSettings.pushbutton\script.py',
            'RevitTools.tab\AIAssistant.panel\ExportToPDF.pushbutton\script.py',
            'RevitTools.tab\AIAssistant.panel\CommandLine.pushbutton\CommandLine.xaml'
          )
          foreach ($relative in $required) {
            $path = Join-Path $staged $relative
            if (-not (Test-Path $path)) { throw "Missing pyRevit command-tool script: $path" }
          }

      - name: Assemble Inno Setup payload tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $payloadRoot = Join-Path $env:GITHUB_WORKSPACE 'installer\payload'
          New-Item -ItemType Directory -Path $payloadRoot -Force | Out-Null
          foreach ($year in @('2023', '2024', '2025')) {
            $source = Join-Path $env:GITHUB_WORKSPACE ('payload-download\AuroraRevit-Payload-Revit' + $year + '\Revit' + $year)
            if (-not (Test-Path $source)) { throw "Missing Revit payload: $source" }
            Copy-Item $source (Join-Path $payloadRoot ('Revit' + $year)) -Recurse -Force
          }
          $pyRevitSource = Join-Path $env:GITHUB_WORKSPACE 'pyRevit_Extensions\AuroraRevit.extension'
          $pyRevitDestination = Join-Path $payloadRoot 'pyRevit\AuroraRevit.extension'
          if (-not (Test-Path $pyRevitSource)) { throw "Missing staged pyRevit extension: $pyRevitSource" }
          Copy-Item $pyRevitSource $pyRevitDestination -Recurse -Force
          $commonSource = Join-Path $env:GITHUB_WORKSPACE 'payload-download\AuroraRevit-Payload-Revit2025\common'
          if (-not (Test-Path $commonSource)) { throw "Missing common proxy payload: $commonSource" }
          Copy-Item $commonSource (Join-Path $payloadRoot 'common') -Recurse -Force
          foreach ($path in @(
            (Join-Path $payloadRoot 'common\AiProxy\AiProxy.exe'),
            (Join-Path $payloadRoot 'common\AiProxyGui\AuroraRevit.ProxyGui.exe'),
            (Join-Path $payloadRoot 'Revit2023\Release\RevitAddin\AuroraRevit.RevitAddin.dll'),
            (Join-Path $payloadRoot 'Revit2024\Release\RevitAddin\AuroraRevit.RevitAddin.dll'),
            (Join-Path $payloadRoot 'Revit2025\Release\RevitAddin\AuroraRevit.RevitAddin.dll'),
            (Join-Path $payloadRoot 'pyRevit\AuroraRevit.extension\RevitTools.tab\AIAssistant.panel\CommandLogger.pushbutton\script.py'),
            (Join-Path $payloadRoot 'pyRevit\AuroraRevit.extension\RevitTools.tab\AIAssistant.panel\CommandLine.pushbutton\script.py'),
            (Join-Path $payloadRoot 'pyRevit\AuroraRevit.extension\RevitTools.tab\AIAssistant.panel\CommandLogViewer.pushbutton\script.py'),
            (Join-Path $payloadRoot 'pyRevit\AuroraRevit.extension\RevitTools.tab\AIAssistant.panel\CommandToolsStatus.pushbutton\script.py'),
            (Join-Path $payloadRoot 'pyRevit\AuroraRevit.extension\RevitTools.tab\AIAssistant.panel\ElementInspector.pushbutton\script.py'),
            (Join-Path $payloadRoot 'pyRevit\AuroraRevit.extension\RevitTools.tab\AIAssistant.panel\QuickSettings.pushbutton\script.py'),
            (Join-Path $payloadRoot 'pyRevit\AuroraRevit.extension\RevitTools.tab\AIAssistant.panel\ExportToPDF.pushbutton\script.py'),
            (Join-Path $payloadRoot 'pyRevit\AuroraRevit.extension\RevitTools.tab\AIAssistant.panel\CommandLine.pushbutton\CommandLine.xaml')
          )) {
            if (-not (Test-Path $path)) { throw "Missing installer input: $path" }
          }

      - name: Install latest Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Compile single-file installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseVersion = if ($env:GITHUB_REF -match '^refs/tags/v') { $env:GITHUB_REF_NAME.Substring(1) } else { $env:RELEASE_VERSION }
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe was not found at $iscc" }
          & $iscc "/DMyAppVersion=$releaseVersion" "$env:GITHUB_WORKSPACE\installer\installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed with exit code $LASTEXITCODE." }
          $output = "$env:GITHUB_WORKSPACE\installer\output\AuroraRevit-Setup.exe"
          if (-not (Test-Path $output)) { throw "Installer was not created: $output" }
          Write-Host "Created $output"

      - name: Upload single-file installer
        uses: actions/upload-artifact@v4
        with:
          name: AuroraRevit-Setup
          if-no-files-found: error
          retention-days: 30
          path: installer/output/AuroraRevit-Setup.exe

  release:
    name: Publish AuroraRevit-Setup.exe release asset
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    needs: installer
    runs-on: ubuntu-latest
    steps:
      - name: Download single-file installer
        uses: actions/download-artifact@v4
        with:
          name: AuroraRevit-Setup
          path: release-assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ env.RELEASE_TITLE }}
          body: |
            AuroraRevit Command Tools Edition.

            Included pyRevit buttons:
            - CommandLogger: journal command logging to Excel/CSV.
            - CommandLine: dockable AI command bar with code review.
            - CommandLogViewer: recent log inspection and folder access.
            - CommandToolsStatus: installation and proxy diagnostics.
            - ElementInspector: read-only element parameters and geometry preview.
            - QuickSettings: model, Ollama, logging, and theme preferences.
            - ExportToPDF: safe-preview sheet/view export through Revit PrintManager.

            The installer also creates the Aurora Command Tools desktop shortcut.
          generate_release_notes: true
          files: release-assets/AuroraRevit-Setup.exe
